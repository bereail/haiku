<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de lanzamiento — Librook</title>
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --surface-alt:#f0eee7;
    --border:#e2dfd5;
    --text:#232820;
    --text-muted:#6c6f66;
    --accent:#3a6b5c;
    --accent-contrast:#ffffff;
    --accent-soft:#e3ece7;
    --warn:#8a6a1f;
    --warn-soft:#f3ebd6;
    --danger:#8a4a3a;
    --danger-soft:#f1e3dd;
    --neutral:#6c6f66;
    --neutral-soft:#e9e8e1;
    --radius:10px;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){}
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1d1a;
      --surface:#242621;
      --surface-alt:#2b2d27;
      --border:#3a3c35;
      --text:#eceae3;
      --text-muted:#9b9c93;
      --accent:#6fae98;
      --accent-contrast:#13201b;
      --accent-soft:#263430;
      --warn:#d8b25a;
      --warn-soft:#352f1e;
      --danger:#d98f7c;
      --danger-soft:#3a2b25;
      --neutral:#9b9c93;
      --neutral-soft:#2f3129;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1d1a;
    --surface:#242621;
    --surface-alt:#2b2d27;
    --border:#3a3c35;
    --text:#eceae3;
    --text-muted:#9b9c93;
    --accent:#6fae98;
    --accent-contrast:#13201b;
    --accent-soft:#263430;
    --warn:#d8b25a;
    --warn-soft:#352f1e;
    --danger:#d98f7c;
    --danger-soft:#3a2b25;
    --neutral:#9b9c93;
    --neutral-soft:#2f3129;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
  a{color:var(--accent)}
  h1,h2,h3,h4{margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  p{margin:0 0 8px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .app{display:flex;min-height:100vh}
  .sidebar{
    width:220px;flex:0 0 220px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:6px 10px 14px}
  .brand h1{font-size:16px}
  .brand p{font-size:12px;color:var(--text-muted);margin:0}
  nav.navlist{display:flex;flex-direction:column;gap:2px;flex:1}
  .navbtn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:none;
    background:transparent;border-radius:8px;color:var(--text-muted);transition:background .15s,color .15s;
  }
  .navbtn svg{width:17px;height:17px;flex:0 0 17px}
  .navbtn:hover{background:var(--surface-alt);color:var(--text)}
  .navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .sidefoot{padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .savebox{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;padding:0 10px}
  .savedot{width:6px;height:6px;border-radius:50%;background:var(--neutral);flex:0 0 6px}
  .savedot.saved{background:var(--accent)}
  .savedot.error{background:var(--danger)}
  .themebtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text-muted);font-size:12.5px}
  .themebtn:hover{color:var(--text)}
  .themebtn svg{width:14px;height:14px}

  main.content{flex:1;min-width:0;padding:28px 32px 60px;max-width:1040px}
  .view[hidden]{display:none}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
  .cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
  .stat .value{font-size:20px;font-weight:600}

  .progressbar{height:8px;border-radius:5px;background:var(--neutral-soft);overflow:hidden}
  .progressbar > span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s}

  .hero{display:flex;flex-direction:column;gap:16px;margin-bottom:22px}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .hero-top .pct{font-size:34px;font-weight:700;color:var(--accent)}
  .nextaction{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:16px 18px}
  .nextaction .tag{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:4px}
  .nextaction p{font-size:15px;margin:0}
  .blockerbox{background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--radius);padding:14px 18px}
  .blockerbox .tag{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--danger);font-weight:700;margin-bottom:6px}
  .blockerbox ul{margin:0;padding-left:18px;font-size:13.5px}

  details.helpbox{margin-top:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:0}
  details.helpbox summary{cursor:pointer;padding:10px 14px;font-size:13px;color:var(--text-muted);list-style:none}
  details.helpbox summary::-webkit-details-marker{display:none}
  details.helpbox summary:before{content:"▸ ";color:var(--accent)}
  details.helpbox[open] summary:before{content:"▾ "}
  details.helpbox .helpbody{padding:0 16px 14px;font-size:13px;color:var(--text-muted)}
  details.helpbox .helpbody ul{margin:6px 0;padding-left:18px}

  .sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px;flex-wrap:wrap}
  .sectionhead h2{font-size:19px}
  .sectionhead .sub{font-size:12.5px;color:var(--text-muted)}

  .phase{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden}
  .phase > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .phase > summary::-webkit-details-marker{display:none}
  .phase > summary .ph-left{display:flex;align-items:center;gap:10px}
  .phase > summary .ph-left:before{content:"▸";color:var(--text-muted);font-size:13px}
  .phase[open] > summary .ph-left:before{content:"▾"}
  .phase-progress{font-size:12px;color:var(--text-muted);white-space:nowrap}
  .phasebody{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}

  .task{border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);padding:10px 12px}
  .task-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;justify-content:space-between}
  .task-main{display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}
  .task-name{font-weight:600;font-size:14px}
  .task-meta{font-size:11.5px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap}
  .task-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .badge.st-pendiente{background:var(--neutral-soft);color:var(--text-muted)}
  .badge.st-pendiente .dot{background:var(--neutral)}
  .badge.st-en-curso{background:var(--warn-soft);color:var(--warn)}
  .badge.st-en-curso .dot{background:var(--warn)}
  .badge.st-bloqueada{background:var(--danger-soft);color:var(--danger)}
  .badge.st-bloqueada .dot{background:var(--danger)}
  .badge.st-completada{background:var(--accent-soft);color:var(--accent)}
  .badge.st-completada .dot{background:var(--accent)}
  .badge.prio-alta{background:var(--danger-soft);color:var(--danger)}
  .badge.prio-media{background:var(--warn-soft);color:var(--warn)}
  .badge.prio-baja{background:var(--neutral-soft);color:var(--text-muted)}

  select.statusselect{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12.5px}

  details.taskdetail{margin-top:6px}
  details.taskdetail summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none}
  details.taskdetail summary::-webkit-details-marker{display:none}
  details.taskdetail .tbody{padding-top:6px;font-size:12.5px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px}
  details.taskdetail textarea{width:100%;min-height:50px;margin-top:4px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:6px 8px;color:var(--text);resize:vertical}
  details.taskdetail label{font-weight:600;color:var(--text)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters input[type="search"],.filters select{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px}
  .filters input[type="search"]{flex:1;min-width:160px}

  .btn{border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
  .btn-primary{background:var(--accent);color:var(--accent-contrast)}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{background:var(--surface-alt)}
  .btn-ghost-danger{background:transparent;border:1px solid var(--border);color:var(--danger)}
  .btn-ghost-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
  .btn-sm{padding:5px 10px;font-size:12px}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--text-muted);font-weight:600}
  .field input,.field select,.field textarea{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--text)}
  .field textarea{resize:vertical;min-height:60px}

  .entry{border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);padding:10px 12px;margin-bottom:8px}
  .entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
  .entry-date{font-size:12px;color:var(--text-muted);font-weight:600}
  .entry-text{font-size:13.5px}
  .entry-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .entry-link{font-size:11.5px;color:var(--text-muted)}

  .decision{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);padding:12px 14px;margin-bottom:10px}
  .decision h3{font-size:14.5px}
  .decision .meta{font-size:11.5px;color:var(--text-muted);margin-bottom:6px}
  .decision .row{font-size:13px;margin-bottom:3px}
  .decision .row b{font-weight:600}

  .metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
  .metriccard{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .metriccard .label{font-size:12px;color:var(--text-muted)}
  .metriccard .valrow{display:flex;align-items:center;gap:8px}
  .metriccard .valrow .big{font-size:20px;font-weight:700}
  .metriccard .valrow .big.empty{font-size:12.5px;color:var(--text-muted);font-weight:400}
  .metriccard input{width:70px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;background:var(--surface)}

  .banner{border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
  .banner.danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}

  .confirmbox{background:var(--danger-soft);border:1px solid var(--danger);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12.5px}
  .confirmbox .actions{display:flex;gap:8px;margin-top:8px}

  .configcard{margin-bottom:16px}
  .configcard h3{font-size:14.5px;margin-bottom:4px}
  .configcard p.hint{font-size:12.5px;color:var(--text-muted);margin-bottom:10px}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateY(0)}

  @media (max-width:860px){
    .app{flex-direction:column}
    .sidebar{width:100%;flex:none;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;z-index:20}
    .brand{padding:0 10px;flex:0 0 auto}
    .brand p{display:none}
    nav.navlist{flex-direction:row;flex:1;overflow-x:auto}
    .navbtn{white-space:nowrap}
    .sidefoot{display:none}
    main.content{padding:18px 16px 60px}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Librook</h1>
      <p>Panel de lanzamiento</p>
    </div>
    <nav class="navlist" aria-label="Secciones del panel">
      <button class="navbtn" data-view="inicio"><svg><use href="#ic-home"/></svg>Inicio</button>
      <button class="navbtn" data-view="roadmap"><svg><use href="#ic-map"/></svg>Hoja de ruta</button>
      <button class="navbtn" data-view="tareas"><svg><use href="#ic-tasks"/></svg>Tareas</button>
      <button class="navbtn" data-view="bitacora"><svg><use href="#ic-log"/></svg>Bitácora</button>
      <button class="navbtn" data-view="decisiones"><svg><use href="#ic-decision"/></svg>Decisiones</button>
      <button class="navbtn" data-view="metricas"><svg><use href="#ic-metric"/></svg>Métricas</button>
      <button class="navbtn" data-view="config"><svg><use href="#ic-settings"/></svg>Configuración</button>
    </nav>
    <div class="sidefoot">
      <div class="savebox" id="saveindicator" role="status" aria-live="polite">
        <span class="savedot" id="savedot"></span>
        <span id="savetext">Sin cambios todavía</span>
      </div>
      <button class="themebtn" id="themetoggle" type="button"></button>
    </div>
  </aside>

  <main class="content">

    <section id="view-inicio" class="view"></section>
    <section id="view-roadmap" class="view" hidden></section>
    <section id="view-tareas" class="view" hidden></section>
    <section id="view-bitacora" class="view" hidden></section>
    <section id="view-decisiones" class="view" hidden></section>
    <section id="view-metricas" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  function fmtDate(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    return parseInt(p[2],10)+" "+MESES[parseInt(p[1],10)-1]+" "+p[0];
  }
  function todayISO(){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function escapeHtml(s){
    if(s==null) return "";
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uid(prefix){
    return prefix+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  }

  // ---------- Estado y persistencia ----------
  var state = null;
  var storageBroken = false;

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.tasks)) return parsed;
      }
    }catch(e){ storageBroken = true; }
    return seedData();
  }

  var saveTimer=null, lastSavedAt=null;
  function scheduleSave(){
    setSaveIndicator("saving");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(persist,350);
  }
  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      lastSavedAt = Date.now();
      storageBroken=false;
      setSaveIndicator("saved");
      showToast("Guardado");
    }catch(e){
      storageBroken=true;
      setSaveIndicator("error");
      showToast("No se pudo guardar — exportá un respaldo");
    }
  }
  function snapshotBackup(){
    try{ localStorage.setItem(BACKUP_KEY, JSON.stringify({savedAt:new Date().toISOString(), data:state})); }catch(e){}
  }

  function setSaveIndicator(kind){
    var dot=document.getElementById("savedot"), txt=document.getElementById("savetext");
    dot.className="savedot"+(kind==="saved"?" saved":kind==="error"?" error":"");
    if(kind==="saving") txt.textContent="Guardando…";
    else if(kind==="error") txt.textContent="Error al guardar";
    else updateSavedAgo();
  }
  setInterval(function(){ if(lastSavedAt) updateSavedAgo(); }, 5000);
  function updateSavedAgo(){
    var txt=document.getElementById("savetext");
    if(!lastSavedAt){ txt.textContent="Sin cambios todavía"; return; }
    var s=Math.round((Date.now()-lastSavedAt)/1000);
    txt.textContent = s<3 ? "Guardado ✓" : s<60 ? "Guardado hace "+s+"s" : "Guardado hace "+Math.round(s/60)+"min";
  }

  var toastTimer=null;
  function showToast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  // ---------- Cálculos derivados ----------
  function computeStats(){
    var total=state.tasks.length, done=0;
    var byPhase={};
    PHASES.forEach(function(p){ byPhase[p.id]={total:0,done:0}; });
    state.tasks.forEach(function(t){
      byPhase[t.phaseId].total++;
      if(t.status==="completada"){ done++; byPhase[t.phaseId].done++; }
    });
    var percent = total? Math.round(done/total*100):0;
    var currentPhase = null;
    for(var i=0;i<PHASES.length;i++){
      var ph=byPhase[PHASES[i].id];
      if(ph.total>0 && ph.done<ph.total){ currentPhase=PHASES[i]; break; }
    }
    if(!currentPhase) currentPhase = PHASES[PHASES.length-1];
    var blockers = state.tasks.filter(function(t){ return t.status==="bloqueada"; });
    return {total:total, done:done, percent:percent, byPhase:byPhase, currentPhase:currentPhase, blockers:blockers};
  }

  function suggestNextAction(){
    var prio={alta:0,media:1,baja:2};
    var candidates = state.tasks.filter(function(t){ return t.status==="bloqueada"; })
      .sort(function(a,b){ return prio[a.priority]-prio[b.priority]; });
    if(!candidates.length) candidates = state.tasks.filter(function(t){ return t.status==="en-curso"; })
      .sort(function(a,b){ return prio[a.priority]-prio[b.priority]; });
    if(!candidates.length) candidates = state.tasks.filter(function(t){ return t.status==="pendiente"; })
      .sort(function(a,b){ return prio[a.priority]-prio[b.priority]; });
    return candidates[0] || null;
  }

    renderActive();

    else if(activeView==="metricas") renderMetricas();
    else if(activeView==="config") renderConfig();

  var pendingImport = null;
  function onImportFileChosen(ev){
    var file = ev.target.files[0];
    pendingImport = null;
    var box = document.getElementById("import-preview");
    box.innerHTML="";
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ box.innerHTML = '<div class="confirmbox">El archivo no es un JSON válido.</div>'; return; }
      if(!parsed || !Array.isArray(parsed.tasks)){
        box.innerHTML = '<div class="confirmbox">El archivo no tiene el formato esperado de este panel.</div>'; return;
      }
      pendingImport = parsed;
      box.innerHTML = '<div class="confirmbox">Este archivo tiene '+parsed.tasks.length+' tareas, '+(parsed.log||[]).length+' entradas de bitácora y '+(parsed.decisions||[]).length+' decisiones.'+
        ' Va a <b>reemplazar</b> lo que tenés ahora (se guarda un respaldo automático antes).'+
        '<div class="actions"><button class="btn btn-primary btn-sm" data-action="confirm-import">Importar y reemplazar</button> <button class="btn btn-ghost btn-sm" data-action="cancel-import">Cancelar</button></div></div>';
    };
    reader.readAsText(file);
  }

  // ---------- Eventos ----------
  document.querySelectorAll(".navbtn").forEach(function(b){
    b.addEventListener("click", function(){ switchView(b.getAttribute("data-view")); });
  });

  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action==="goto"){ switchView(el.getAttribute("data-view")); return; }

    if(action==="suggest-next"){
      var s = suggestNextAction();
      if(s){
        state.project.nextAction = {taskId:s.id, text:(s.status==="bloqueada"?"Desbloquear: ":"Avanzar: ")+s.name+(s.notes?" — "+s.notes:"")};
        scheduleSave(); renderInicio();
      }
      return;
    }
    if(action==="edit-next"){ document.getElementById("nextedit").hidden=false; return; }
    if(action==="cancel-next"){ document.getElementById("nextedit").hidden=true; return; }
    if(action==="save-next"){
      var txt = document.getElementById("nextedit-text").value.trim();
      state.project.nextAction = {taskId:null, text: txt || "Sin definir."};
      scheduleSave(); renderInicio();
      return;
    }

    if(action==="add-log"){
      var date = document.getElementById("log-date").value || todayISO();
      var text = document.getElementById("log-text").value.trim();
      var taskId = document.getElementById("log-task").value || null;
      if(!text) return;
      state.log.push({id:uid("l"), date:date, text:text, taskId:taskId});
      scheduleSave(); renderBitacora();
      return;
    }
    if(action==="del-log"){
      state.log = state.log.filter(function(e){ return e.id!==el.getAttribute("data-id"); });
      scheduleSave(); renderBitacora();
      return;
    }

    if(action==="add-decision"){
      var topic=document.getElementById("dec-topic").value.trim();
      var decision=document.getElementById("dec-decision").value.trim();
      if(!topic || !decision) return;
      state.decisions.push({
        id:uid("d"), topic:topic, decision:decision,
        reason:document.getElementById("dec-reason").value.trim(),
        date:document.getElementById("dec-date").value || todayISO(),
        status:document.getElementById("dec-status").value,
        consequences:document.getElementById("dec-consequences").value.trim()
      });
      scheduleSave(); renderDecisiones();
      return;
    }
    if(action==="del-decision"){
      state.decisions = state.decisions.filter(function(d){ return d.id!==el.getAttribute("data-id"); });
      scheduleSave(); renderDecisiones();
      return;
    }

    if(action==="set-metric"){
      var key = el.getAttribute("data-key");
      var input = document.getElementById("m-"+key);
      var val = parseInt(input.value,10);
      if(isNaN(val) || val<0) return;
      state.metrics.counters[key]=val;
      scheduleSave(); renderMetricas();
      return;
    }
    if(action==="add-metric-note"){
      var mtext = document.getElementById("mn-text").value.trim();
      if(!mtext) return;
      state.metrics.notes.push({id:uid("mn"), date:todayISO(), text:mtext});
      scheduleSave(); renderMetricas();
      return;
    }
    if(action==="del-metric-note"){
      state.metrics.notes = state.metrics.notes.filter(function(n){ return n.id!==el.getAttribute("data-id"); });
      scheduleSave(); renderMetricas();
      return;
    }

    if(action==="export-json"){
      var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var stamp = new Date().toISOString().replace(/[:.]/g,"-").slice(0,16);
      a.href=url; a.download = "librook-panel-"+stamp+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast("Respaldo exportado");
      return;
    }
    if(action==="confirm-import"){
      if(!pendingImport) return;
      snapshotBackup();
      state = pendingImport;
      pendingImport = null;
      persist();
      renderActive();
      renderConfig();
      showToast("Importado");
      return;
    }
    if(action==="cancel-import"){
      pendingImport = null;
      document.getElementById("import-preview").innerHTML="";
      document.getElementById("import-file").value="";
      return;
    }
    if(action==="restore-auto-backup"){
      try{
        var b = JSON.parse(localStorage.getItem(BACKUP_KEY));
        state = b.data;
        persist();
        renderActive();
        showToast("Respaldo restaurado");
      }catch(e){}
      return;
    }
    if(action==="reset-confirm"){
      document.getElementById("reset-confirm-box").innerHTML =
        '<div class="confirmbox">¿Reiniciar de verdad? Se borran tus cambios (queda un respaldo automático).'+
        '<div class="actions"><button class="btn btn-ghost-danger btn-sm" data-action="reset-do">Sí, reiniciar</button> <button class="btn btn-ghost btn-sm" data-action="reset-cancel">Cancelar</button></div></div>';
      return;
    }
    if(action==="reset-cancel"){ document.getElementById("reset-confirm-box").innerHTML=""; return; }
    if(action==="reset-do"){
      snapshotBackup();
      state = seedData();
      persist();
      renderActive();
      renderConfig();
      showToast("Reiniciado");
      return;
    }
  });

  document.body.addEventListener("change", function(ev){
    var el = ev.target;
    if(el.matches('[data-action="set-status"]')){
      var t = taskById(el.getAttribute("data-taskid"));
      if(t){
        t.status = el.value; t.updatedAt = todayISO(); scheduleSave();
        if(activeView==="tareas") renderTareaResults(); else renderActive();
      }
      return;
    }
    if(el.id==="task-q"){ taskFilters.q = el.value; renderTareaResults(); return; }
    if(el.id==="task-f-phase"){ taskFilters.phase = el.value; renderTareaResults(); return; }
    if(el.id==="task-f-status"){ taskFilters.status = el.value; renderTareaResults(); return; }
    if(el.id==="task-f-prio"){ taskFilters.priority = el.value; renderTareaResults(); return; }
  });
  document.body.addEventListener("input", function(ev){
    var el = ev.target;
    if(el.id==="task-q"){ taskFilters.q = el.value; renderTareaResults(); return; }
    if(el.matches('[data-action="edit-notes"]')){
      var t = taskById(el.getAttribute("data-taskid"));
      if(t){ t.notes = el.value; scheduleSave(); }
      return;
    }
  });

  // ---------- Tema ----------
  function applyTheme(mode){
    var root=document.documentElement;
    if(mode==="light") root.setAttribute("data-theme","light");
    else if(mode==="dark") root.setAttribute("data-theme","dark");
    else root.removeAttribute("data-theme");
    var btn=document.getElementById("themetoggle");
    var icon = mode==="light"?"#ic-sun":mode==="dark"?"#ic-moon":"#ic-auto";
    var label = mode==="light"?"Claro":mode==="dark"?"Oscuro":"Automático";
    btn.innerHTML = '<svg><use href="'+icon+'"/></svg>Tema: '+label;
  }
  function currentThemeMode(){
    try{ return localStorage.getItem(THEME_KEY) || "auto"; }catch(e){ return "auto"; }
  }
  document.getElementById("themetoggle").addEventListener("click", function(){
    var order=["auto","light","dark"];
    var cur=currentThemeMode();
    var next=order[(order.indexOf(cur)+1)%order.length];
    try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
    applyTheme(next);
  });

  // ---------- Init ----------
  state = loadState();
  applyTheme(currentThemeMode());
  switchView("inicio");

})();
</script>
</body>
</html>
