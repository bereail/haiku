<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de control — Haiku</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sr-only" aria-hidden="true">
  <symbol id="ic-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></symbol>
  <symbol id="ic-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2a4 4 0 0 0 4-4 9 9 0 0 0-9-7.4z"/><circle cx="7.5" cy="11.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="7.8" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-ux" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></symbol>
  <symbol id="ic-ui" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="1.5"/><path d="M3 9h18M8 18v3M16 18v3"/></symbol>
  <symbol id="ic-features" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19l1-5.8L3.6 9.1l5.8-.8z"/></symbol>
  <symbol id="ic-stats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="ic-arch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="13" width="6" height="7" rx="1"/><rect x="14" y="13" width="6" height="7" rx="1"/><rect x="9" y="4" width="6" height="7" rx="1"/><path d="M12 11v2M7 13v-2h10v2"/></symbol>
  <symbol id="ic-testing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v5l-5.5 9.5A1.8 1.8 0 0 0 6 20h12a1.8 1.8 0 0 0 1.5-2.5L14 8V3"/><path d="M7.5 15h9"/></symbol>
  <symbol id="ic-seo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></symbol>
  <symbol id="ic-roadmap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6v13l6-2 6 2 4-2V4l-4 2-6-2-6 2z"/></symbol>
  <symbol id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></symbol>
  <symbol id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></symbol>
  <symbol id="ic-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.3-2-3.4-2.3.7a7.6 7.6 0 0 0-1.7-1l-.4-2.4h-4l-.4 2.4a7.6 7.6 0 0 0-1.7 1l-2.3-.7-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.3 2 3.4 2.3-.7a7.6 7.6 0 0 0 1.7 1l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 1.7-1l2.3.7 2-3.4z"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand brand-row">
      <img class="brand-logo" src="assets/logo.png" width="30" height="30" alt="" aria-hidden="true">
      <div><h1>Haiku</h1><p>Panel de control</p></div>
    </div>
    <nav class="navlist" aria-label="Secciones del panel">
      <button class="navbtn" data-view="dashboard"><svg><use href="#ic-dashboard"/></svg>Dashboard</button>
      <button class="navbtn" data-view="identidad"><svg><use href="#ic-palette"/></svg>Identidad visual</button>
      <button class="navbtn" data-view="ux"><svg><use href="#ic-ux"/></svg>UX</button>
      <button class="navbtn" data-view="ui"><svg><use href="#ic-ui"/></svg>UI</button>
      <button class="navbtn" data-view="funcionalidades"><svg><use href="#ic-features"/></svg>Funcionalidades</button>
      <button class="navbtn" data-view="estadisticas"><svg><use href="#ic-stats"/></svg>Estadísticas</button>
      <button class="navbtn" data-view="arquitectura"><svg><use href="#ic-arch"/></svg>Arquitectura</button>
      <button class="navbtn" data-view="testing"><svg><use href="#ic-testing"/></svg>Testing y calidad</button>
      <button class="navbtn" data-view="seo"><svg><use href="#ic-seo"/></svg>SEO</button>
      <button class="navbtn" data-view="roadmap"><svg><use href="#ic-roadmap"/></svg>Roadmap y gestión</button>
    </nav>
    <div class="sidefoot">
      <div class="savebox" id="saveindicator" role="status" aria-live="polite">
        <span class="savedot" id="savedot"></span>
        <span id="savetext">Sin cambios todavía</span>
      </div>
      <div class="footrow">
        <button class="themebtn" id="themetoggle" type="button"></button>
        <button class="gearbtn" id="gearbtn" type="button" aria-label="Configuración"><svg><use href="#ic-gear"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <div class="searchwrap">
        <input type="search" id="global-search" placeholder="Buscar en todo el panel…" aria-label="Buscar en todo el panel">
        <div class="search-results" id="search-results" hidden></div>
      </div>
    </div>

    <div style="padding:14px 32px 0;max-width:1040px">
    <section id="view-dashboard" class="view"></section>
    <section id="view-identidad" class="view" hidden></section>
    <section id="view-ux" class="view" hidden></section>
    <section id="view-ui" class="view" hidden></section>
    <section id="view-funcionalidades" class="view" hidden></section>
    <section id="view-estadisticas" class="view" hidden></section>
    <section id="view-arquitectura" class="view" hidden></section>
    <section id="view-testing" class="view" hidden></section>
    <section id="view-seo" class="view" hidden></section>
    <section id="view-roadmap" class="view" hidden></section>
    </div>
  </main>
</div>

<div class="modalbackdrop" id="configmodal" hidden>
  <div class="modalbox" role="dialog" aria-label="Configuración">
    <button type="button" class="modalclose" data-action="cfg-close" aria-label="Cerrar">✕</button>
    <h2>Configuración y respaldo</h2>
    <div id="configmodal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/utils.js"></script>
<script src="js/components.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/config.js"></script>
<script src="js/sections/dashboard.js"></script>
<script src="js/sections/identidad.js"></script>
<script src="js/sections/ux.js"></script>
<script src="js/sections/ui.js"></script>
<script src="js/sections/funcionalidades.js"></script>
<script src="js/sections/estadisticas.js"></script>
<script src="js/sections/arquitectura.js"></script>
<script src="js/sections/testing.js"></script>
<script src="js/sections/seo.js"></script>
<script src="js/sections/roadmap.js"></script>
<script>
(function(){
  "use strict";
  var U = window.Haiku.utils;
  var store = window.Haiku.store;

  var state = store.init();
  U.applyIdentityTokens(state.identity.tokens);

  // ---------- Tema (claro/oscuro/automático) ----------
  function applyTheme(mode){
    var root=document.documentElement;
    if(mode==="light") root.setAttribute("data-theme","light");
    else if(mode==="dark") root.setAttribute("data-theme","dark");
    else root.removeAttribute("data-theme");
    var btn=document.getElementById("themetoggle");
    var icon = mode==="light"?"#ic-sun":mode==="dark"?"#ic-moon":"#ic-auto";
    var label = mode==="light"?"Claro":mode==="dark"?"Oscuro":"Automático";
    btn.innerHTML = '<svg><use href="'+icon+'"/></svg>Tema: '+label;
  }
  function currentThemeMode(){
    try{ return localStorage.getItem(store.THEME_KEY) || "auto"; }catch(e){ return "auto"; }
  }
  document.getElementById("themetoggle").addEventListener("click", function(){
    var order=["auto","light","dark"];
    var cur=currentThemeMode();
    var next=order[(order.indexOf(cur)+1)%order.length];
    try{ localStorage.setItem(store.THEME_KEY,next); }catch(e){}
    applyTheme(next);
  });
  applyTheme(currentThemeMode());

  // ---------- Indicador de guardado ----------
  var saveTimerDisplay=null;
  store.setOnSaveStateChange(function(kind){
    var dot=document.getElementById("savedot"), txt=document.getElementById("savetext");
    dot.className="savedot"+(kind==="saved"?" saved":kind==="error"?" error":"");
    if(kind==="saving") txt.textContent="Guardando…";
    else if(kind==="error") txt.textContent="Error al guardar";
    else txt.textContent = store.lastSavedAgoText();
  });
  setInterval(function(){ document.getElementById("savetext").textContent = store.lastSavedAgoText(); }, 5000);

  window.Haiku.config.wire();
  window.Haiku.router.init(store, "dashboard");
})();
</script>
</body>
</html>
