<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Haiku — Tu biblioteca personal. Registrá tus lecturas, organizá tu colección y seguí tu progreso lector." />
    <meta name="theme-color" content="#2d4a3e" />
    <meta property="og:title" content="Haiku — Tu biblioteca personal" />
    <meta property="og:description" content="Registrá tus lecturas, organizá tu colección y seguí tu progreso lector." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Haiku" />
    <meta name="twitter:description" content="Tu biblioteca personal de libros." />
    <title>Haiku — Tu biblioteca personal</title>
    <!-- Tema antes del primer cuadro: sin esto la página se dibujaba en claro y
         recién después React aplicaba el oscuro (destello). Misma lógica que
         src/hooks/useTheme.ts: elección guardada o, si no hay, la del sistema. -->
    <script>
      try {
        var t = localStorage.getItem('haiku_theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carga no bloqueante: evita que la tipografía externa demore el primer
         render (medido con Lighthouse: ~850ms de render-blocking). El truco
         media="print" + onload hace que el navegador la baje en paralelo sin
         bloquear, y recién la aplica cuando está lista. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@300;400;500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
